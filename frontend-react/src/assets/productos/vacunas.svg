<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
  <title>Jeringa para vacunas</title>
  <rect width="320" height="180" rx="24" fill="#F7F4E9"/>

  <g transform="translate(160 90) rotate(-30)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Émbolo -->
    <path d="M-69 0h43" fill="none" stroke="#294F4B" stroke-width="7"/>
    <path d="M-72-20v40m-9-40h18m-18 40h18"
