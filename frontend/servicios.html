<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - Gaty Perry</title>
    <link rel="icon" href="img/logo-nav.gif" type="image/gif">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="navbar"></div>
    <main>
        <section class="page-hero">
            <div class="container"><span class="eyebrow">Catálogo oficial</span>
                <h1 class="display-5 fw-bold mt-3">Servicios veterinarios</h1>
                <p class="lead">Consulta precios, duración y especies atendidas antes de solicitar una hora.</p>
            </div>
        </section>
        <section class="section-space">
            <div class="container">
                <div class="filter-panel mb-4">
                    <div class="row g-3">
                        <div class="col-md-7"><label class="form-label" for="buscarServicio">Buscar
                                servicio</label><input id="buscarServicio" type="search" class="form-control"
                                placeholder="Ej. vacuna o consulta"></div>
                        <div class="col-md-5"><label class="form-label" for="categoriaServicio">Categoría</label><select
                                id="categoriaServicio" class="form-select"></select></div>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <p id="cantidadServicios" class="text-secondary mb-0"></p><a href="citas.html"
                        class="btn btn-primary">Agendar una hora</a>
                </div>
                <div id="listaServicios" class="row g-4"></div>
            </div>
        </section>
    </main>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/servicios.js"></script>
</body>

</html>
