spring:
  application:
    name: pedidos-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8085

app:
  jwt:
    issuer: gaty-perry-auth
    public-key: ${JWT_PUBLIC_KEY}
  productos:
    base-url: ${PRODUCTOS_BASE_URL:http://productos:8084}
    internal-token: ${INTERNAL_API_TOKEN}
