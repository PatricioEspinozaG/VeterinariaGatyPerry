spring:
  application:
    name: pacientes-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

server:
  port: 8082

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    issuer: gaty-perry-auth
    public-key: ${JWT_PUBLIC_KEY}