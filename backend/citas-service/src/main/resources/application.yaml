spring:
  application:
    name: citas-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8083

app:
  jwt:
    issuer: gaty-perry-auth
    public-key: ${JWT_PUBLIC_KEY}
  pacientes:
    base-url: ${PACIENTES_BASE_URL:http://localhost:8082}
  auth:
    base-url: ${AUTH_BASE_URL:http://localhost:8081}